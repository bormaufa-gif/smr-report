plugins { id 'com.android.application' }
def releaseKeyPath = System.getenv('ANDROID_KEYSTORE_PATH')
def buildNumber = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()
android {
 namespace 'ru.smr.report'
 compileSdk 35
 defaultConfig { applicationId 'ru.smr.report'; minSdk 26; targetSdk 35; versionCode 100 + buildNumber; versionName '1.1.' + buildNumber }
 signingConfigs {
  release {
   if (releaseKeyPath) {
    storeFile file(releaseKeyPath)
    storeType 'PKCS12'
    storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
    keyAlias System.getenv('ANDROID_KEY_ALIAS')
    keyPassword System.getenv('ANDROID_KEY_PASSWORD')
   }
  }
 }
 buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
