<title>Отчёт СМР</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 system-ui,-apple-system,Roboto,sans-serif;background:#eef1f5;color:#1b2430;padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:#1f4e79;color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));font-size:19px;font-weight:600;display:flex;align-items:center;gap:12px}
header .logo{height:30px;width:auto;flex:none}
header #hd{min-width:0}
main{padding:12px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #d5dbe3;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px;font-size:12px;color:#6b7686}
nav button span{display:block;font-size:22px}
nav button.on{color:#1f4e79;font-weight:700}
.card{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.banner{border-radius:12px;padding:12px 14px;margin-bottom:10px;font-weight:600}
.banner.ok{background:#d8f0dd;color:#1b6b2f}.banner.no{background:#fdeccb;color:#8a5a00}
label{display:block;font-size:13px;color:#566274;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #c5ccd6;border-radius:10px;background:#fff}
textarea{min-height:76px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;font:inherit;font-weight:600;background:#1f4e79;color:#fff;margin-top:12px}
.btn.sec{background:#dde6f0;color:#1f4e79}.btn.del{background:#fadcdc;color:#a42424}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.work{border:1px solid #d5dbe3;border-radius:12px;padding:10px;margin-top:10px;background:#f8fafc}
.work .top{display:flex;justify-content:space-between;font-size:13px;color:#6b7686}
.work .top b{color:#a42424;padding:0 6px}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos div{position:relative}
.photos img{width:80px;height:80px;object-fit:cover;border-radius:8px}
.photos b{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;background:#a42424;color:#fff;text-align:center;line-height:24px;font-size:14px}
/* RD viewer */
.rdbtn{display:block;width:100%;margin-top:8px;padding:10px;border:1px solid #1f4e79;background:#eaf1f8;color:#1f4e79;border-radius:10px;font:inherit;font-size:14px;font-weight:600}
#rd{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column}
#rd .rdh{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:#1f4e79;color:#fff;font-size:14px}
#rd .rdh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rd .rdh a{color:#fff;font-size:13px}
#rd .rdh button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:8px;width:36px;height:36px;font-size:18px}
#rd iframe{flex:1;border:0;width:100%}
@media(min-width:900px){
 #rd{left:50%}
 body.rdopen header,body.rdopen nav{width:50vw}
 body.rdopen main{margin:0;max-width:none;width:50vw}
}
/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid #c5ccd6;background:#fff;border-radius:20px;padding:8px 13px;font:inherit;font-size:14px;color:#1b2430}
.chip.on{background:#1f4e79;color:#fff;border-color:#1f4e79}
.trow{display:grid;grid-template-columns:1fr 90px;gap:8px}
/* diameters */
.drow{border:1px dashed #c5ccd6;border-radius:10px;padding:8px;margin-top:8px;background:#fff}
.drow .top{display:flex;justify-content:space-between;font-size:13px;color:#6b7686;margin-bottom:4px}
.drow .top b{color:#a42424;padding:0 6px}
pre{white-space:pre-wrap;word-break:break-word;font:14px/1.45 ui-monospace,Menlo,monospace;margin:6px 0 0}
.sub{color:#6b7686;font-size:13px}
.pcard{border:1px solid #d5dbe3;border-radius:10px;padding:8px 10px;margin-top:6px;background:#fff;cursor:pointer}
.pcard.sel{border-color:#1f4e79;background:#eef4fb;display:flex;align-items:center;gap:8px}
.pcard .pn{font-weight:600;font-size:14px;flex:1}
.pcard .pv{color:#6b7686;font-size:12px;margin-top:2px}
.pcard .pch{color:#1f4e79;font-size:13px;white-space:nowrap}
h3{margin:0 0 4px;font-size:16px}
.empty{text-align:center;color:#6b7686;padding:40px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:25;display:flex;align-items:flex-end}
.dlg>div{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
/* чек-листы и заявки */
.badge{display:inline-block;font-size:12px;padding:2px 9px;border-radius:20px;background:#dde6f0;color:#1f4e79;white-space:nowrap}
.badge.ok{background:#d8f0dd;color:#1b6b2f}.badge.bad{background:#fadcdc;color:#a42424}.badge.warn{background:#fdeccb;color:#8a5a00}
.xrow{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.card.tap:active{background:#e6edf5}
.item{border-top:1px solid #e3e8ee;padding:10px 0}.item:first-child{border-top:0}
.sbtns{display:flex;gap:6px;margin-top:6px}
.sbtns button{flex:1;padding:9px;border:1px solid #c5ccd6;background:#fff;border-radius:10px;font:inherit;font-size:16px}
.sbtns button.y.on{background:#d8f0dd;border-color:#1b6b2f}.sbtns button.n.on{background:#fadcdc;border-color:#a42424}.sbtns button.x.on{background:#e8e8e8;border-color:#888}
/* люди: распознавание лиц */
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid #e3e8ee}.prow:first-of-type{border-top:0}
.prow img,.prow .noph{width:48px;height:48px;border-radius:10px;object-fit:cover;flex:none;background:#dde6f0}
.prow .nm{flex:1;min-width:0}.prow .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow select{flex:1;min-width:0;padding:9px}
.prow .x{border:0;background:#fadcdc;color:#a42424;border-radius:8px;width:34px;height:34px;font-size:16px;flex:none}
.brig{font-size:13px;font-weight:700;color:#1f4e79;margin-top:10px}
.chkl{display:flex!important;gap:10px;align-items:flex-start;color:#1b2430!important;font-size:14px!important}
.chkl input{width:auto;margin-top:2px}
</style>
</head>

  const val=w.s.split(' · ')[0];
  L.push(`   ${lab}: ${val}`);
  if(m)L.push(`   Название: ${m}`);
  if(line&&w.ln&&w.ln.trim())L.push(`   Участок линии: ${w.ln.trim()}`);
 }
 const other=!w.k||w.k===OTHER;
 L.push(`   Вид работ: ${other?(w.t.trim()||'—'):w.k}`);
 if(!other&&w.t.trim())L.push(`   Уточнение: ${w.t.trim()}`);
 if(needDiam(w)){const dt=dsText(w);if(dt)L.push(`   ${lk(w)?lk(w).tit:'Диаметры'}: ${dt}`)}
 if(w.vol)L.push(`   Объём: ${w.vol}${w.unit?' '+w.unit:''}`);
 return L;
}
const workName=w=>{const dt=needDiam(w)?dsText(w):'';const kn=w.k&&w.k!==OTHER?w.k+(dt?` (${dt})`:''):'';const base=kn?(w.t.trim()?`${kn} — ${w.t.trim()}`:kn):w.t.trim();const sn=sname(w.s),m=hasMarks(w)?mk(w):'';return base&&w.s&&w.s!==OTHER?`${sn}${m?' ('+m+')':''}${w.ln&&w.ln.trim()?' ['+w.ln.trim()+']':''}: ${base}`:base};

/* ---------- текст отчёта (шаблон) ---------- */
function buildText(r){
 const L=[`ОТЧЁТ СМР — ${fd(r.date)}`];
 const sites=[...new Set(r.works.filter(w=>workName(w)&&w.c).map(w=>w.c))];
 L.push(`Участок: ${sites.length?sites.join(', '):'—'}`);
 L.push(`Ответственный: ${r.resp||'—'}`);
 L.push(`Время работы: ${r.t1&&r.t2?r.t1+'–'+r.t2:'—'}`);
 L.push('','Выполнено:');
 const ws=r.works.filter(w=>workName(w));
 if(ws.length)ws.forEach((w,i)=>{if(i)L.push('');L.push(...workBlock(w,i+1))});
 else L.push('—');
 if(r.people)L.push('',`Персонал: ${r.people} чел.`);
 const st=staffText(r.date);if(st&&r.people)L.push(`Состав: ${st}`);
 const tech=(r.tech||[]).filter(x=>(x.n||'').trim());
 if(tech.length)L.push(`Техника: ${tech.map(x=>x.n.trim()+(x.h?' — '+x.h+' ч':'')).join('; ')}`);
 const idl=idleOf(r);
 if(idl.length)L.push('',`Простои: ${idl.map(x=>`${x.r||'причина не указана'} — ${x.h||'?'} ч${x.w?' (решает: '+x.w+')':''}${x.c?': '+x.c:''}`).join('; ')}`);
 if(r.other&&r.other.trim())L.push('',`Прочие работы: ${r.other.trim()}`);
 if(r.problems)L.push('',`Проблемы / замечания: ${r.problems}`);
 if(r.plan)L.push('',`План на завтра: ${r.plan}`);
 return L.join('\n');
}

/* ---------- строки для листа «Журнал» (одна строка на работу / диаметр / технику) ---------- */
const jc=c=>(c||'').replace(/\.([^.]+)$/,' $1');          // ГНТ…-11.01.100.КЖ → ГНТ…-11.01.100 КЖ, как в журнале
const jnum=v=>{const x=parseFloat(String(v??'').replace(',','.'));return isNaN(x)?'':x};
function buildRows(r){
 const rows=[],resp=r.resp?`Ответственный: ${r.resp}`:'';
 const extra=[r.people?`персонал ${r.people} чел.`:'',r.t1&&r.t2?`время ${r.t1}–${r.t2}`:''].filter(Boolean).join('; ');
 const ws=r.works.filter(w=>workName(w));
 ws.forEach(w=>{
  const c=jc(w.c),first=rows.length===0,note=[resp,first?extra:''].filter(Boolean).join('; ');
  const ok=needDiam(w)?(w.ds||[]).filter(x=>x.d&&x.n):[];
  if(ok.length)ok.forEach(x=>{const w2=Object.assign({},w,{ds:[x]});rows.push({b:c,d:c,e:workName(w2),f:jnum(x.n),g:dk(w).unit,i:rows.length?resp:note,j:w.pos||''})});
  else rows.push({b:c,d:c,e:workName(w),f:jnum(w.vol),g:w.unit||'',i:rows.length?resp:note,j:w.pos||''});
 });
 const sites=[...new Set(ws.map(w=>jc(w.c)).filter(Boolean))].join(', ')||'Не указан в отчёте';
 (r.tech||[]).filter(x=>(x.n||'').trim()).forEach(x=>rows.push({b:sites,d:'Техника',e:x.n.trim(),f:jnum(x.h),g:'маш.-ч',i:''}));
 return rows;
}

// [очки, позиция, очки поиска]: по виду работ, маркам, диаметрам и строке поиска
function smRank(w,q){
 const kt=stemsOf(w.k&&w.k!==OTHER?w.k:w.t,5),qt=stemsOf(q,2),marks=(w.nm||[]).map(x=>(x.v||'').trim().toLowerCase()).filter(Boolean),
  dms=(w.ds||[]).map(r=>(String(r.d||'').match(/\d+/)||[])[0]).filter(Boolean);
 return smFor(w).map(x=>{const nm=(x[3]||'').toLowerCase(),sec=(x[2]||'').toLowerCase();let sc=0,qs=0;
  kt.forEach(t=>{if(nm.includes(t))sc+=2});qt.forEach(t=>{if(nm.includes(t)||sec.includes(t))qs+=5});marks.forEach(m=>{if(sec.includes(m))sc+=3});
  dms.forEach(d=>{if(nm.includes(' '+d+' мм'))sc+=4});
  return [sc+qs,x,qs]}).filter(a=>q?a[2]>0:true).sort((a,b)=>b[0]-a[0]);
}

 return {kind:'report',key:cfg.key||'',id:String(h.id),date:h.date,rows:h.rows||[],probs:h.probs||[],ppl:h.ppl||[],idle:h.idle||[],sender:cfg.me||pick(/Ответственный: (.*)/),resp:pick(/Ответственный: (.*)/),

  problems:pick(/Проблемы \/ замечания: ([\s\S]*?)(?:\n\nПлан на завтра: |$)/),plan:pick(/План на завтра: ([\s\S]*)$/),text:t,sentAt:h.at};
}
async function postJSON(obj){
 const body=JSON.stringify(obj);
 let r;
 try{r=await fetch(cfg.sink,{method:'POST',body,headers:{'Content-Type':'text/plain;charset=utf-8'}})}
 catch(e){
  try{await fetch(cfg.sink,{method:'POST',body,mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'}});return {opaque:true}}  // CORS-сбой: повтор безопасен, сервер не дублирует по id
  catch(e2){return {err:'нет связи'}}
 }
 try{return {j:await r.json()}}catch(e){return {err:'сервер ответил не так: проверьте адрес и ключ'}}
}
async function syncOne(h){
 const x=await postJSON(payloadOf(h));
 if(x.opaque){h.sync=2;h.err='';return true}
 if(x.err){h.err=x.err;return false}
 const j=x.j;
 if(j&&j.ok){h.sync=1;h.err='';return true}
 h.err=(j&&j.error)||'сервер отклонил';return false;
}

async function markByPhoto(inp){
 const files=[...inp.files];inp.value='';if(!files.length)return;
 if(!ppl.length){toast('Сначала добавьте рабочих с фото лица',4000);return}
 MK=[];
 try{
  for(let i=0;i<files.length;i++){busy(`Ищу лица… ${files.length>1?(i+1)+' из '+files.length:''}`);for(const f of await facesIn(files[i],true)){const m=whoIs(f.d);MK.push({ph:f.ph,id:m.p?m.p.id:0,auto:m.p?m.p.id:0,dist:m.dist})}}
 }catch(e){busy();faErr(e);return}
 busy();
 if(!MK.length){toast('Лиц на фото не найдено. Снимите ближе и при хорошем свете.',5000);return}
 const seen=new Set();MK.forEach(k=>{if(k.id&&seen.has(k.id))k.id=k.auto=0;else if(k.id)seen.add(k.id)});  // один человек — одно лицо
 const day=R.date||today(),opts=id=>`<option value="0">— не отмечать —</option>`+ppl.slice().sort((a,b)=>a.name.localeCompare(b.name)).map(p=>`<option value="${p.id}" ${p.id===id?'selected':''}>${esc(p.name)}</option>`).join('');
 const d=document.createElement('div');d.className='dlg';d.id='dlg';
 d.innerHTML=`<div style="max-height:88vh;overflow:auto"><h3>Найдено лиц: ${MK.length}, узнано: ${MK.filter(k=>k.id).length}</h3><div class="sub">Проверьте имена. Неузнанного можно выбрать из списка вручную.</div>
 ${MK.map((k,i)=>`<div class="prow"><img src="${k.ph}"><select onchange="MK[${i}].id=+this.value">${opts(k.id)}</select>${k.id?(attDay(day).some(a=>a.w===k.id)?'<span class="badge">уже</span>':`<span class="badge ok">${Math.round((1-k.dist)*100)}%</span>`):'<span class="badge warn">?</span>'}</div>`).join('')}
 <button class="btn" onclick="applyMarks()">Отметить</button><button class="btn sec" onclick="$('#dlg').remove()">Отмена</button></div>`;
 document.body.appendChild(d);
}
function applyMarks(){
 const ids=[...new Set(MK.filter(k=>k.id).map(k=>k.id))];
 const manual=new Set(MK.filter(k=>k.id&&k.id!==k.auto).map(k=>k.id));
 $('#dlg').remove();markIds(ids,0,manual);
}
function markIds(ids,man,manualSet){
 const day=R.date||today(),now=new Date(),t=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 const list=att[day]=attDay(day).slice();let n=0;
 ids.forEach(id=>{const m=man||(manualSet&&manualSet.has(id))?1:0,ex=list.find(a=>a.w===id);
  if(!ex){list.push({w:id,t,m});n++}else if(ex.m===2){ex.m=m;ex.t=t;n++}});   // m:2 — перенесён с прошлого отчёта, ждёт подтверждения
 ls.set('att',att);setPeople();toast(n?`Отмечено: ${n} чел. Персонал в отчёте: ${R.people}`:'Все уже были отмечены');pplView();
}
function unmark(id){
 const day=R.date||today();att[day]=attDay(day).filter(a=>a.w!==id);if(!att[day].length)delete att[day];
 ls.set('att',att);const n=attDay(day).length;R.people=n?String(n):'';save();pplView();
}
function exportAtt(){
 const cell=x=>'"'+String(x??'').replace(/"/g,'""')+'"',rows=[];
 Object.keys(att).sort().forEach(d=>att[d].forEach(a=>{const p=pById(a.w)||{name:'(удалён)'};rows.push([fd(d),p.name,p.brig,p.prof,a.t,a.m?'вручную':'по фото'])}));
 dlFile(`Отметки_людей_${today()}.csv`,'﻿'+[['Дата','ФИО','Бригада','Профессия','Время','Способ'],...rows].map(l=>l.map(cell).join(';')).join('\r\n'),'text/csv');
}

async function pfAdd(inp){
 const files=[...inp.files];inp.value='';let bad=0;
 try{for(let i=0;i<files.length;i++){busy(`Обрабатываю фото ${i+1} из ${files.length}…`);const f=await facesIn(files[i],false);if(f.length!==1){bad++;continue}PF.d.push(f[0].d);PF.phs.push(f[0].ph)}}
 catch(e){busy();faErr(e);return}
 busy();if(bad)toast(`Пропущено фото: ${bad}. На каждом должно быть ровно одно лицо.`,5000);
 pfView();
}
function pfRm(i){PF.d.splice(i,1);PF.phs.splice(i,1);pfView()}
function pfSave(){
 PF.name=PF.name.trim();
 if(!PF.name){toast('Введите ФИО');return}
 if(PF.d.length<2){toast('Добавьте хотя бы 2–3 фото лица');return}
 if(!PF.consent){toast('Без согласия на обработку биометрии сохранять нельзя',4500);return}
 if(!PF.id){const m=whoIs(PF.d[0]);if(m.p&&m.dist<.42&&!confirm(`Похоже, это ${m.p.name} — он уже есть в списке. Всё равно сохранить как нового?`))return}
 const rec={id:PF.id||Date.now(),name:PF.name,brig:PF.brig.trim(),prof:PF.prof.trim(),d:PF.d,phs:PF.phs,ph:PF.phs[0]||'',consent:1};
 const i=ppl.findIndex(p=>p.id===rec.id);if(i>=0)ppl[i]=rec;else ppl.push(rec);
 ls.set('ppl',ppl);PF=null;toast('Рабочий сохранён');pplView();
}
function pfDel(){
 if(!confirm(`Удалить ${PF.name}? Фото лица будут стёрты, прошлые отметки останутся в выгрузке без имени.`))return;
 ppl=ppl.filter(p=>p.id!==PF.id);ls.set('ppl',ppl);PF=null;pplView();
}

 h+=rows.length?rows.map(r=>{
  const title=chk?r.tpl:reqTitle(r);
  const sub=chk?[fd(r.date),shortCipher(r.cipher),r.place,r.items.filter(i=>i.s).length+'/'+r.items.length+' проверено',cfg.sink&&r.sync!==1&&r.sync!==2?'⏳ не в журнале'+(r.err?': '+r.err:''):'']:[fd(r.date),shortCipher(r.cipher),r.items.filter(i=>(i.n||'').trim()).length+' поз.',r.err?'⚠ '+r.err:''];
  return `<div class="card tap" onclick="openX('${p}',${r.id})"><div class="xrow"><h3>${esc(title)}</h3><span class="badge ${xCls(p,r)}">${esc(xStatus(p,r))}</span></div><div class="sub">${esc(sub.filter(Boolean).join(' · '))}</div></div>`}).join('')
  :`<div class="empty">Пока пусто.<br>Нажмите «＋», чтобы добавить ${chk?'чек-лист':'заявку'}.</div>`;
 if(rows.length)h+=`<button class="btn sec" onclick="exportX('${p}')">Выгрузить в Excel (CSV)</button>`;
 $('#view').innerHTML=h;
 if(window._xf){window._xf=0;const i=$('#view input[type=search]');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
}
function openX(p,id){let rec=JSON.parse(JSON.stringify(xall(p).find(r=>r.id===id)));if(p==='req')rec=reqNorm(rec);xgo({view:'form',rec})}
function pickView(){
 $('#hd').textContent='Новый чек-лист';
 const c=XS.pc||'',ks=c?ckKinds(c):[];
 let h=`<div class="card"><label style="margin-top:0">Шифр РД</label><select onchange="XS.pc=this.value;XS.pk='';XS.po='';pickView()"><option value="">— выберите шифр РД —</option>`;
 for(const [g] of GROUPS)h+=`<optgroup label="${esc(g)}">`+CIPHERS.filter(x=>x.g===g).map(x=>`<option value="${esc(x.v)}" ${x.v===c?'selected':''}>${esc(x.l)}</option>`).join('')+`</optgroup>`;
 h+=`</select>`;
 if(c){
  h+=`<label>Вид работ</label><select onchange="XS.pk=this.value;pickView()"><option value="">— выберите вид работ —</option>${ks.map(n=>`<option ${n===XS.pk?'selected':''}>${esc(n)}</option>`).join('')}<option value="${OTHER}" ${XS.pk===OTHER?'selected':''}>Другой вид работ (ввести вручную)</option></select>`;
  if(XS.pk===OTHER)h+=`<input style="margin-top:8px" placeholder="Название вида работ" value="${esc(XS.po||'')}" oninput="XS.po=this.value">`;
  if(XS.pk)h+=`<button class="btn" onclick="startWork()">Создать чек-лист</button>`;
 }
 h+=`<div class="sub" style="margin-top:10px">Чек-лист включает этапы подготовки к работе, основные этапы по выбранному виду работ и завершение со сдачей.</div></div>
 <h3 style="margin:14px 2px 6px">Общие чек-листы (без привязки к шифру)</h3>`+Object.keys(TPL).map(n=>`<div class="card tap" onclick='startCheck(${JSON.stringify(n).replace(/'/g,"&#39;")})'><h3>${esc(n)}</h3><div class="sub">${TPL[n].length} пунктов</div></div>`).join('')+`<button class="btn sec" onclick="xback()">‹ Назад</button>`;
 $('#view').innerHTML=h;
}
function startWork(){
 const k=XS.pk===OTHER?(XS.po||'').trim():XS.pk;
 if(!k){toast('Введите вид работ');return}
 xgo({view:'form',rec:{tpl:k,cipher:XS.pc,date:today(),place:'',items:ckItems(k)}});
}
function startCheck(n){xgo({view:'form',rec:{tpl:n,date:today(),place:'',items:TPL[n].map(t=>({t,s:'',n:''}))}})}
function checkForm(){
 const r=XS.rec;$('#hd').textContent=r.id?'Правка чек-листа':'Новый чек-лист';
 let cards='',last=null,buf='',cnt=0,done=0;
 const flush=()=>{if(buf)cards+=`<div class="card">${last?`<h3>${CK_G[last]} <span class="sub">(${done}/${cnt})</span></h3>`:''}${buf}</div>`;buf='';cnt=0;done=0};
 r.items.forEach((it,i)=>{
  const gg=it.g||null;if(gg!==last){flush();last=gg}
  cnt++;if(it.s)done++;
  buf+=`<div class="item"><div>${esc(it.t)}</div>
  <div class="sbtns"><button class="y ${it.s==='y'?'on':''}" onclick="setItem(${i},'y')">✓ Да</button><button class="n ${it.s==='n'?'on':''}" onclick="setItem(${i},'n')">✗ Нет</button><button class="x ${it.s==='x'?'on':''}" onclick="setItem(${i},'x')">— Н/п</button></div>
  ${it.s==='n'?`<input style="margin-top:6px" placeholder="Что не так" value="${esc(it.n)}" oninput="XS.rec.items[${i}].n=this.value">`:''}</div>`;
 });
 flush();
 $('#view').innerHTML=`<div class="card"><h3>${esc(r.tpl)}</h3>${r.cipher?`<div class="sub">${esc(shortCipher(r.cipher))}</div>`:''}
 <label>Дата</label><input type="date" value="${esc(r.date)}" onchange="XS.rec.date=this.value">
 <label>Место / конструктив / линия / резервуар</label><input value="${esc(r.place)}" oninput="XS.rec.place=this.value"></div>${cards}
 <button class="btn" onclick="saveCheck()">Сохранить</button>
 <button class="btn sec" onclick="copyX(checkText(XS.rec))">Скопировать текст</button>
 ${r.id?`<button class="btn del" onclick="delX('chk')">Удалить</button>`:''}
 <button class="btn sec" onclick="xback()">‹ К списку</button>`;
}
function setItem(i,s){const it=XS.rec.items[i];it.s=it.s===s?'':s;const y=window.scrollY;checkForm();window.scrollTo(0,y)}
function checkText(r){
 const m={y:'✓',n:'✗',x:'—'},L=[`ЧЕК-ЛИСТ — ${r.tpl}`];
 if(r.cipher)L.push(`Шифр РД: ${shortCipher(r.cipher)}`);
 L.push(`Дата: ${fd(r.date)}`);if(r.place)L.push(`Место: ${r.place}`);
 let g=null;
 r.items.forEach(i=>{if(i.g&&i.g!==g){g=i.g;L.push('',CK_G[g]+':')}L.push(`${m[i.s]||'·'} ${i.t}${i.s==='n'&&i.n?' — '+i.n:''}`)});
 return L.join('\n');
}
function saveCheck(){
 const o=XS.rec;o.sync=0;o.err='';xput('chk',o);
 const bad=o.items.filter(i=>i.s==='n');
 if(bad.length&&confirm('Есть пункты «Нет» ('+bad.length+'). Добавить их в «Проблемы / замечания» текущего отчёта?')){
  const add=bad.map(i=>`${o.tpl}${o.place?' ('+o.place+')':''}: ${i.t}${i.n?' — '+i.n:''}`).join('\n');
  R.problems=(R.problems?R.problems+'\n':'')+add;save();toast('Добавлено в отчёт');
 }
 xback();syncChks();
}
function newReq(){xgo({view:'form',rec:{num:nextReqNum(),date:today(),cipher:'',section:'Площадка нефтебазы',items:[{n:'',u:'',q:'',d:'',p:''}],sent:0,queued:0}})}
function regInfoHtml(){
 if(!cfg.sink)return '<div class="sub" style="margin:6px 2px">Чтобы заявки попадали в реестр и показывали его статусы, подключите таблицу в «Настройках».</div>';
 const reg=(cfg.regReq||[]).slice().reverse().slice(0,8);
 let h=`<div class="sub" style="margin:6px 2px">В реестре заявок: ${(cfg.regReq||[]).length}${cfg.listsAt?', обновлено '+new Date(cfg.listsAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):''} · следующий № ${cfg.nextReq||'—'}</div>`;
 if(reg.length&&!XS.q&&!XS.flt)h+=`<h3 style="margin:10px 2px 6px">Последние в реестре</h3>`+reg.map(g=>`<div class="card"><div class="xrow"><h3>№${g.num} · ${esc(g.title)}</h3><span class="badge ${REQ_CLS[g.stage]||''}">${esc(g.stage)}</span></div><div class="sub">${esc([g.date,g.note].filter(Boolean).join(' · '))}</div></div>`).join('')+`<h3 style="margin:14px 2px 6px">Заявки из приложения</h3>`;
 return h;
}
function addItem(){XS.rec.items.push({n:'',u:'',q:'',d:'',p:''});reqForm()}
function rmItem(j){XS.rec.items.splice(j,1);if(!XS.rec.items.length)XS.rec.items=[{n:'',u:'',q:'',d:'',p:''}];reqForm()}
function reqForm(){
 const r=XS.rec;$('#hd').textContent=r.id?'Правка заявки':'Новая заявка';
 const inp=(k,l,t,extra)=>`<label>${l}</label><input type="${t||'text'}" ${extra||''} value="${esc(r[k])}" oninput="XS.rec.${k}=this.value" onchange="XS.rec.${k}=this.value">`;
 const sent=r.sent===1||r.sent===2;
 const items=r.items.map((it,j)=>`<div class="drow"><div class="top"><span>Позиция ${j+1}</span>${r.items.length>1?`<b onclick="rmItem(${j})">✕</b>`:''}</div>
  <textarea style="min-height:56px" placeholder="Наименование МТР" oninput="XS.rec.items[${j}].n=this.value">${esc(it.n)}</textarea>
  <div class="grid" style="margin-top:8px"><input placeholder="Ед. изм." value="${esc(it.u)}" oninput="XS.rec.items[${j}].u=this.value"><input placeholder="Кол-во" inputmode="decimal" value="${esc(it.q)}" oninput="XS.rec.items[${j}].q=this.value"></div>
  <div class="grid" style="margin-top:8px"><div><div class="sub">Дата выполнения</div><input type="date" value="${esc(it.d)}" onchange="XS.rec.items[${j}].d=this.value"></div><div><div class="sub">Назначение (куда)</div><input placeholder="например, отсыпка РВС" value="${esc(it.p)}" oninput="XS.rec.items[${j}].p=this.value"></div></div></div>`).join('');
 $('#view').innerHTML=`${sent?`<div class="banner ok">Заявка отправлена в реестр (лист «Заявка ${esc(r.num)}»). Правки здесь в таблицу не передаются — меняйте лист в таблице.</div>`:''}${r.err&&!sent?`<div class="banner no">Не отправлена: ${esc(r.err)}</div>`:''}
 <div class="card" style="margin-top:0">
 ${inp('num','Номер заявки','text','inputmode="numeric"')}<div class="sub">Номер берётся из реестра; если занят, таблица назначит следующий свободный.</div>${inp('date','Дата заявки','date')}
 <label>Шифр РД (колонка «Ссылка»)</label>${cipherPick('XS.rec.cipher',r.cipher)}
 ${inp('section','Участок / раздел в заявке')}
 </div>
 <div class="card"><label style="margin-top:0">Позиции</label>${items}<button class="btn sec" style="margin-top:8px;padding:10px" onclick="addItem()">＋ Ещё позиция</button></div>
 <button class="btn sec" style="margin-top:0" onclick="saveReq(false)">Сохранить</button>
 ${sent?'':`<button class="btn" onclick="saveReq(true)">Сохранить и отправить в реестр</button>`}
 <button class="btn sec" onclick="copyX(reqText(XS.rec))">Скопировать текст</button>
 ${r.id?`<button class="btn del" onclick="delX('req')">Удалить</button>`:''}
 <button class="btn sec" onclick="xback()">‹ К списку</button>`;
}
function cipherPick(path,val){
 let h=`<select onchange="${path}=this.value"><option value="">— без шифра —</option>`;
 for(const [g] of GROUPS)h+=`<optgroup label="${esc(g)}">`+CIPHERS.filter(x=>x.g===g).map(x=>`<option value="${esc(x.v)}" ${x.v===val?'selected':''}>${esc(x.l)}</option>`).join('')+`</optgroup>`;
 if(val&&!CIPHERS.some(x=>x.v===val))h+=`<option value="${esc(val)}" selected>${esc(val)}</option>`;
 return h+`</select>`;
}
function reqText(r){
 r=reqNorm(r);
 const L=[`ЗАЯВКА ${r.num?'№'+r.num+' ':''}от ${fd(r.date)}`];
 if(r.cipher)L.push(`Шифр РД: ${shortCipher(r.cipher)}`);
 L.push(`Участок: ${r.section}`);
 r.items.filter(i=>(i.n||'').trim()).forEach((i,k)=>L.push(`${k+1}. ${i.n.trim()}${i.q?' — '+i.q+(i.u?' '+i.u:''):''}${i.d?', к '+fd(i.d):''}${i.p?' ('+i.p+')':''}`));
 return L.join('\n');
}
function saveReq(send){
 const o=XS.rec;
 o.items=o.items.filter(i=>(i.n||'').trim()||(i.q||'').trim());
 if(!o.items.some(i=>(i.n||'').trim())){toast('Заполните хотя бы одну позицию (наименование МТР)');if(!o.items.length)o.items=[{n:'',u:'',q:'',d:'',p:''}];reqForm();return}
 o.items.forEach(i=>{i.n=i.n.trim()});
 if(send){
  if(!cfg.sink||!cfg.key){toast('Сначала укажите адрес и ключ приёма в «Настройках»');return}
  o.queued=1;o.err='';
 }
 xput('req',o);
 xback();
 if(send)syncReqs(true);
}
function delX(p){if(confirm('Удалить запись?')){const r=XS.rec;xdel(p,r.id);if(p==='chk'&&cfg.sink&&r.sync)postJSON(chkPayload(r,true));xback()}}   // из журнала тоже
async function copyX(t){try{await navigator.clipboard.writeText(t);toast('Скопировано. Вставьте в Max')}catch(e){toast('Не удалось скопировать')}}
function exportX(p){
 const cell=x=>{let v=String(x??'').replace(/\n/g,' ');if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'},rows=xrows(p);let head,lines;
 if(p==='chk'){head=['Дата','Чек-лист','Место','Пункт','Результат','Примечание'];lines=rows.flatMap(r=>r.items.map(i=>[fd(r.date),r.tpl,r.place,i.t,{y:'Да',n:'Нет',x:'Н/п'}[i.s]||'',i.n]))}
 else{head=['Номер','Дата заявки','Шифр РД','Позиция','Наименование МТР','Ед. изм.','Количество','Нужно к дате','Назначение','Статус'];lines=rows.flatMap(r=>r.items.map((i,k)=>[r.num,fd(r.date),shortCipher(r.cipher),k+1,i.n,i.u,i.q,fd(i.d),i.p,reqStatus(r)]))}
 dlFile(`${p==='chk'?'Чек-листы':'Заявки'}_${today()}.csv`,'﻿'+[head,...lines].map(l=>l.map(cell).join(';')).join('\r\n'),'text/csv');
}

$('#cl').innerHTML=CIPHERS.map(c=>`<option value="${esc(c.v)}">${esc(c.l)}</option>`).join('');
render();
protectStorage();setTimeout(()=>{syncAll();syncReqs();syncChks();loadLists();loadSmeta();if(page==='sum')loadSum(false)},1500);
</script>
</body>
</html>
